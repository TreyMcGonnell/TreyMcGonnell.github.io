# The tests that need no GPU, no secrets and no private content. They run only when started by hand
# (Actions tab, "ci", Run workflow), never automatically on pushes or pull requests.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (D1–D6, B1 fixtures)
        run: npm test
      - name: 'Build (no private content in CI, so content pages render their empty states)'
        run: npx vite build
      - name: Bundle sizes (G2)
        run: npm run check:size
      - name: Repo hygiene (I8)
        run: npm run check:hygiene
      - name: Dependency audit (I6)
        run: npm audit --audit-level=high --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: End-to-end against the mock API (E1–E9, F2, H1–H3, L2, L3, D7, G3)
        run: npx playwright test
        env:
          CI: 'true'
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - run: ruff check api scripts
      - name: Gateway, limits, CORS, kill switch, retrieval (A1, A2, A5–A8, B1, I5, I7, J1, J2, J4, J5)
        run: pytest -m "not model and not gpu"
      - name: Dependency audit (I6)
        run: pip-audit -r requirements.txt

  api-model:
    # A tiny random Llama with the real tokenizer runs the frame builder on CPU (A3, A4, B1 on real frames).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-model.txt
      - name: Tokenizer files only (ungated mirror, no token needed)
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('unsloth/Llama-3.2-3B-Instruct', local_dir='/tmp/llama', allow_patterns=['tokenizer*', '*config.json', 'special_tokens_map.json'])"
      - run: pytest api/tests/test_inference.py
        env:
          MODEL_PATH: /tmp/llama

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (I1)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
