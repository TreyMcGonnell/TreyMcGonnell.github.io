[project]
name = "trey-lm-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "model: needs the downloaded Llama tokenizer or weights (skipped when absent)",
    "gpu: needs a CUDA GPU and the full model (skipped when absent)",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
